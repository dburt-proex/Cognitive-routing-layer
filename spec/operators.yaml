    {
      "operator_id": "convergent",
      "version": "0.1.0",
      "name": "Convergent Operator",
      "stage": "DECIDE",
      "class": "deterministic",
      "purpose": "Reduce the option set to a single recommendation or to an explicit no-recommendation, by deterministic aggregation of evidence-weighted supporting and opposing claims. This operator computes; it does not generate.",
      "selection_conditions": {
        "task_classes_required": ["PRIORITIZATION", "DIAGNOSTIC", "DESIGN", "GOVERNANCE_EVALUATION", "CHANGE_RISK", "STRATEGY"],
        "task_classes_conditional": [],
        "activation_signals": [],
        "suppression_signals": []
      },
      "input_contract": {
        "required_fields": ["options", "run_claims", "evidence_register", "contradictions"],
        "optional_fields": [],
        "forbidden_fields": ["casa_result"]
      },
      "required_transformations": [
        {
          "transformation_id": "CV-T1",
          "description": "Compute a support score and an opposition score per option from evidence-weighted claims.",
          "verifiable_as": "every option in the ranking carries support, opposition and net values"
        },
        {
          "transformation_id": "CV-T2",
          "description": "Mark each option evidence_sufficient or not against the task-class threshold.",
          "verifiable_as": "every ranked option carries evidence_sufficient and the thresholds applied"
        },
        {
          "transformation_id": "CV-T3",
          "description": "Select only from evidence-sufficient options; otherwise return NO_RECOMMENDATION.",
          "verifiable_as": "selected_option_id is null whenever no option is evidence_sufficient"
        },
        {
