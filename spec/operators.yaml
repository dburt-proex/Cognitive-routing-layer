{
  "registry_id": "RCP-OPERATORS-0.1.0",
  "version": "0.1.0",
  "stage": "v0.1_locked",
  "format_note": "JSON-compatible YAML. Matches the operator-intelligence/leverage-engine control-file convention so a standard-library runtime can parse control files without a YAML dependency.",
  "confidence_factors": {
    "high": 1.0,
    "medium": 0.75,
    "low": 0.5,
    "unknown": 0.0
  },
  "confidence_invariant": "declared_confidence_factor is capped by the evidence ceiling computed from the claim's resolved evidence. A conclusion cannot outrank its evidence.",
  "global_prohibited_behaviors": [
    "emit_private_chain_of_thought",
    "invent_evidence_reference",
    "assert_authorization",
    "modify_policy_or_operator_registry",
    "execute_external_action",
    "claim_human_like_cognition",
    "restate_another_operator_conclusion_as_new_evidence"
  ],
  "operators": [
    {
      "operator_id": "first-principles",
      "version": "0.1.0",
      "name": "First-Principles Operator",
      "stage": "FRAME",
      "class": "analysis",
      "purpose": "Decompose the problem into primitives that are separately checkable, and label each primitive as verified fact, assumption, or unknown, so that every later conclusion rests on an inspectable base rather than on inherited framing.",
      "selection_conditions": {
        "task_classes_required": ["PRIORITIZATION", "DIAGNOSTIC", "DESIGN", "GOVERNANCE_EVALUATION", "CHANGE_RISK", "STRATEGY"],
        "task_classes_conditional": [],
        "activation_signals": [],
        "suppression_signals": []
      },
      "input_contract": {
        "required_fields": ["problem_statement", "constraints"],
        "optional_fields": ["observations", "options", "evidence_register"],
        "forbidden_fields": ["casa_result", "prior_recommendation"]
      },
      "required_transformations": [
        {
          "transformation_id": "FP-T1",
          "description": "Decompose the problem into at least three primitives.",
          "verifiable_as": "output.primitives has minItems 3"
        },
        {
          "transformation_id": "FP-T2",
          "description": "Label every primitive as verified_fact, assumption, or unknown.",
          "verifiable_as": "every output.primitives[].status is in the enum"
        },
        {
          "transformation_id": "FP-T3",
          "description": "Every claim must derive from at least one declared primitive.",
          "verifiable_as": "every output.claims[].derived_from resolves to a primitive_id in output.primitives"
        },
        {
          "transformation_id": "FP-T4",
          "description": "Every primitive labelled verified_fact must carry at least one evidence reference.",
          "verifiable_as": "primitives with status verified_fact have non-empty evidence_refs"
        }
      ],
      "output_contract": {
        "required_fields": ["operator_id", "primitives", "claims", "assumptions", "declared_confidence"],
        "min_claims": 1,
        "max_claims": 12,
        "produces_options": false,
        "structured_payload_key": "primitives"
      },
      "evidence_requirements": {
        "min_evidence_refs_per_claim": 1,
        "min_distinct_evidence": 1,
        "minimum_evidence_quality": 50,
        "allow_unverified_evidence": true
      },
      "assumption_handling": {
        "must_declare_assumptions": true,
        "assumption_becomes_missing_evidence": true,
        "unlabelled_primitive_is_failure": true
      },
      "confidence_rules": {
        "declared_confidence_allowed": ["high", "medium", "low", "unknown"],
        "cannot_exceed_evidence_ceiling": true,
        "ceiling_penalty_when_unknown_primitives_exceed": 0.5
      },
      "failure_conditions": [
        "FP-F1: fewer than three primitives",
        "FP-F2: a primitive lacks a status label",
        "FP-F3: a claim derives from no declared primitive",
        "FP-F4: a verified_fact primitive carries no evidence reference"
      ],
      "prohibited_behaviors": [
        "accept_the_framing_of_the_problem_statement_without_decomposition",
        "label_an_assumption_as_verified_fact"
      ],
      "evaluation_fixtures": ["leverage-prioritization", "governance-decision", "high-risk-code-change"]
    },
    {
      "operator_id": "systemic",
      "version": "0.1.0",
      "name": "Systemic Operator",
      "stage": "FRAME",
      "class": "analysis",
      "purpose": "Map the components, the directed relations between them, and at least one feedback loop, so that effects propagating through the system are visible before an option is chosen.",
      "selection_conditions": {
        "task_classes_required": ["GOVERNANCE_EVALUATION", "CHANGE_RISK", "DIAGNOSTIC", "DESIGN", "STRATEGY"],
        "task_classes_conditional": ["PRIORITIZATION"],
        "activation_signals": ["systemic_coupling", "external_impact", "precedent_setting"],
        "suppression_signals": []
      },
      "input_contract": {
        "required_fields": ["problem_statement", "constraints"],
        "optional_fields": ["observations", "options", "evidence_register"],
        "forbidden_fields": ["casa_result", "prior_recommendation"]
      },
      "required_transformations": [
        {
          "transformation_id": "SY-T1",
          "description": "Declare at least three components.",
          "verifiable_as": "output.components has minItems 3"
        },
        {
          "transformation_id": "SY-T2",
          "description": "Declare directed relations with polarity between declared components only.",
          "verifiable_as": "every relation.from and relation.to resolve to a component_id"
        },
        {
          "transformation_id": "SY-T3",
          "description": "Declare at least one feedback loop that is an actual cycle in the relation graph.",
          "verifiable_as": "every feedback_loop.path forms a closed cycle over declared relations"
        }
      ],
      "output_contract": {
        "required_fields": ["operator_id", "components", "relations", "feedback_loops", "claims", "assumptions", "declared_confidence"],
        "min_claims": 1,
        "max_claims": 10,
        "produces_options": false,
        "structured_payload_key": "components"
      },
      "evidence_requirements": {
        "min_evidence_refs_per_claim": 1,
        "min_distinct_evidence": 1,
        "minimum_evidence_quality": 50,
        "allow_unverified_evidence": true
      },
      "assumption_handling": {
        "must_declare_assumptions": true,
        "assumption_becomes_missing_evidence": true,
        "unlabelled_primitive_is_failure": false
      },
      "confidence_rules": {
        "declared_confidence_allowed": ["high", "medium", "low", "unknown"],
        "cannot_exceed_evidence_ceiling": true,
        "ceiling_penalty_when_unknown_primitives_exceed": 0.5
      },
      "failure_conditions": [
        "SY-F1: fewer than three components",
        "SY-F2: a relation references an undeclared component",
        "SY-F3: no feedback loop declared",
        "SY-F4: a declared feedback loop is not a closed cycle in the relation graph"
      ],
      "prohibited_behaviors": [
        "assert_a_feedback_loop_without_declaring_its_path",
        "treat_a_list_of_stakeholders_as_a_system_map"
      ],
      "evaluation_fixtures": ["governance-decision", "high-risk-code-change"]
    },
    {
      "operator_id": "divergent",
      "version": "0.1.0",
      "name": "Divergent Operator",
      "stage": "EXPLORE",
      "class": "analysis",
      "purpose": "Generate a set of materially distinct options, each with a stated mechanism, so that convergence has a real option space rather than a single pre-selected answer with decorations.",
      "selection_conditions": {
        "task_classes_required": ["PRIORITIZATION", "DESIGN", "STRATEGY"],
        "task_classes_conditional": ["GOVERNANCE_EVALUATION", "CHANGE_RISK", "DIAGNOSTIC"],
        "activation_signals": ["contested_options", "novel_domain"],
        "suppression_signals": []
      },
      "input_contract": {
        "required_fields": ["problem_statement", "constraints"],
        "optional_fields": ["options", "evidence_register"],
        "forbidden_fields": ["casa_result", "prior_recommendation"]
      },
      "required_transformations": [
        {
          "transformation_id": "DV-T1",
          "description": "Produce at least three options.",
          "verifiable_as": "output.options has minItems 3"
        },
        {
          "transformation_id": "DV-T2",
          "description": "Every option declares a distinct mechanism.",
          "verifiable_as": "pairwise normalized token overlap of option.mechanism is below the policy distinctness threshold"
        },
        {
          "transformation_id": "DV-T3",
          "description": "Every option declares what it gives up.",
          "verifiable_as": "every option.tradeoff is a non-empty string"
        }
      ],
      "output_contract": {
        "required_fields": ["operator_id", "options", "claims", "assumptions", "declared_confidence"],
        "min_claims": 1,
        "max_claims": 12,
        "produces_options": true,
        "structured_payload_key": "options"
      },
      "evidence_requirements": {
        "min_evidence_refs_per_claim": 0,
        "min_distinct_evidence": 0,
        "minimum_evidence_quality": 0,
        "allow_unverified_evidence": true,
        "note": "Option generation is explicitly permitted without evidence. Options carry no decision weight until other operators attach evidence-bearing claims to them. This is the one operator whose output is inert by design."
      },
      "assumption_handling": {
        "must_declare_assumptions": true,
        "assumption_becomes_missing_evidence": false,
        "unlabelled_primitive_is_failure": false
      },
      "confidence_rules": {
        "declared_confidence_allowed": ["medium", "low", "unknown"],
        "cannot_exceed_evidence_ceiling": false,
        "max_declared_confidence": "medium",
        "rationale": "Generating an option is not evidence that the option is good. Divergent output is capped below high by contract."
      },
      "failure_conditions": [
        "DV-F1: fewer than three options",
        "DV-F2: two options exceed the distinctness threshold",
        "DV-F3: an option declares no tradeoff",
        "DV-F4: declared_confidence above medium",
        "DV-F5: a claim takes a supports or opposes polarity, which is ranking an option"
      ],
      "prohibited_behaviors": [
        "produce_restatements_of_one_option_as_distinct_options",
        "rank_or_recommend_an_option",
        "claim_evidentiary_support_for_a_generated_option"
      ],
      "evaluation_fixtures": ["leverage-prioritization", "evidence-starved-convergence"]
    },
    {
      "operator_id": "abductive",
      "version": "0.1.0",
      "name": "Abductive Operator",
      "stage": "EXPLAIN",
      "class": "analysis",
      "purpose": "Produce the most plausible explanations for stated observations together with at least one rival explanation and a discriminating test, so that an inference to best explanation is falsifiable rather than asserted.",
      "selection_conditions": {
        "task_classes_required": ["DIAGNOSTIC"],
        "task_classes_conditional": ["PRIORITIZATION", "GOVERNANCE_EVALUATION", "CHANGE_RISK", "DESIGN", "STRATEGY"],
        "activation_signals": ["unexplained_observation"],
        "suppression_signals": []
      },
      "input_contract": {
        "required_fields": ["problem_statement", "observations"],
        "optional_fields": ["constraints", "evidence_register"],
        "forbidden_fields": ["casa_result", "prior_recommendation"]
      },
      "required_transformations": [
        {
          "transformation_id": "AB-T1",
          "description": "Produce at least two hypotheses, one leading and at least one rival.",
          "verifiable_as": "output.hypotheses has minItems 2 and exactly one has rank 1"
        },
        {
          "transformation_id": "AB-T2",
          "description": "Every hypothesis names the observations it explains.",
          "verifiable_as": "every hypothesis.explains resolves to an observation_id in input.observations"
        },
        {
          "transformation_id": "AB-T3",
          "description": "Every hypothesis declares a discriminating test that would separate it from its rivals.",
          "verifiable_as": "every hypothesis.discriminating_test is a non-empty string"
        },
        {
          "transformation_id": "AB-T4",
          "description": "Observations left unexplained by the leading hypothesis are declared.",
          "verifiable_as": "output.unexplained_observations equals input observation ids minus the leading hypothesis explains set"
        }
      ],
      "output_contract": {
        "required_fields": ["operator_id", "hypotheses", "unexplained_observations", "claims", "assumptions", "declared_confidence"],
        "min_claims": 1,
        "max_claims": 8,
        "produces_options": false,
        "structured_payload_key": "hypotheses"
      },
      "evidence_requirements": {
        "min_evidence_refs_per_claim": 1,
        "min_distinct_evidence": 1,
        "minimum_evidence_quality": 50,
        "allow_unverified_evidence": true
      },
      "assumption_handling": {
        "must_declare_assumptions": true,
        "assumption_becomes_missing_evidence": true,
        "unlabelled_primitive_is_failure": false
      },
      "confidence_rules": {
        "declared_confidence_allowed": ["high", "medium", "low", "unknown"],
        "cannot_exceed_evidence_ceiling": true,
        "max_declared_confidence_without_discriminating_test": "low"
      },
      "failure_conditions": [
        "AB-F1: fewer than two hypotheses",
        "AB-F2: no single leading hypothesis or more than one rank 1",
        "AB-F3: a hypothesis explains an observation that was not supplied",
        "AB-F4: a hypothesis declares no discriminating test"
      ],
      "prohibited_behaviors": [
        "present_a_single_hypothesis_as_the_explanation",
        "treat_an_unfalsifiable_hypothesis_as_leading"
      ],
      "evaluation_fixtures": ["governance-decision"]
    },
